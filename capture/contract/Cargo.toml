[package]
name = "keycollide-contract"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Test contract that returns SCMaps whose keys are distinct in XDR but collide in some languages' native maps."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=29.0.1"

[dev-dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
