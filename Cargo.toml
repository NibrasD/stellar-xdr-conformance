[workspace]
resolver = "2"
members = ["generator", "runners/rust"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
stellar-xdr = { version = "=30.0.0", default-features = false, features = ["std", "serde", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
